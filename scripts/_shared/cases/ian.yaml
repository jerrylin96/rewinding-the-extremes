# Hurricane Ian (2022) — multi-state compound event
#
# Ian struck the US twice: high-end Cat 4 landfall near Cayo Costa, FL at
# ~19:05 UTC on Sep 28 2022, then Cat 1 landfall near Georgetown, SC at
# ~14:00 UTC on Sep 30 after re-emerging into the Atlantic.  The 66h
# window starts at 2022-09-28 00Z (peak intensity in the eastern Gulf,
# ~19h pre-FL-landfall) and runs through 2022-09-30 18Z, so frame 11
# brackets the SC landfall.  FL landfall sits at frame ~3.
#
# This windowing prioritizes the multi-state compound character of Ian
# over the FL track-bust forecast story (which would require a much
# earlier IC).  The mode contrast is intentional: with `end`-only
# conditioning the IC is unconstrained, so the ensemble can in principle
# generate trajectories that bypass FL while still ending near SC — a
# diagnostic of how much FL impact uncertainty grows when the storm's
# Gulf position isn't pinned.

display_name: Hurricane Ian
year: 2022
timezone: America/New_York
base: /projectnb/eb-general/jlin404/scratch/ian

ensemble:
  start_time: { year: 2022, month: 9, day: 28, hour: 0 }
  size: 1000
  modes: [start, end, both]
  random_seed: 0

# Purpose-named spatial regions (see scripts/_shared/README.md).
regions:
  # Cause: synoptic precursor box for the joint PCA on z500 (+ msl).  Captures
  # the W. Atlantic / SE-US ridge that steered Ian, the upstream mid-latitude
  # trough, and both landfall sites (FL + SC).  Tighter than the Sandy box
  # because the steering pattern was smaller-scale and lower-latitude.
  synoptic: { lon: [-110, -50], lat: [15, 50] }
  # Effect: free_end_states member rank / mean / maps.
  impact: { lon: [-90, -75], lat: [22, 36] }
  # TC-track detection domain + track-map view; widened north (lat 36) vs. a
  # FL-only case to fully contain the SC landfall and post-landfall decay.
  track: { lon: [-90, -70], lat: [20, 36] }
  # Landfall classification boxes for the end-conditioned landfall-split
  # diagnostic (tc_landfall_split): a member's primary track is "Florida" if
  # it has any fix in landfall_fl, else "bypass" if it reaches landfall_sc.
  #   landfall_fl -- SW FL landfall near Cayo Costa (~26.7N, 82.2W) through the
  #     peninsula crossing out the east coast (~29N, 81W).
  #   landfall_sc -- SC landfall near Georgetown (~33.3N, 79.3W).
  # Latitudes do not overlap (FL <= 30, SC >= 32) so the split is unambiguous.
  landfall_fl: { lon: [-83.5, -80.0], lat: [24.5, 30.0] }
  landfall_sc: { lon: [-81.5, -78.5], lat: [32.0, 34.5] }

plots:
  members: [0, 1, 2, 3]

tc_tracks:
  trackers: [tempest]
  # Warm-core thickness filter (Zarzycki & Ullrich 2017): reject cold-core lows;
  # needs z300/z500 in the zarr.  Same as always passing --warm-core (override a
  # single run with --no-warm-core).
  warm_core: true
  # SC landfall (~09-30 14Z) sits ~4h before frame 11 (09-30 18Z); use frame 11
  # as the single annotation anchor.  FL landfall is at frame ~3 and is not
  # separately annotated pending multi-landfall schema support in tc_tracks.
  landfall_frame: 11

# spread_rmse_crps.domains gives each variable its own analysis box, because
# "which region" is a property of the variable, not of the run.  z500 is the
# synoptic-scale cause (the steering flow), so it reduces over
# regions.synoptic, the same pixels the EOF analysis uses.  msl is the storm
# itself, so it reduces over regions.impact: averaging the MSLP ensemble
# spread over the full [-110, -50] x [15, 50] synoptic box would dilute the
# cyclone's mass signature with quiet background, understating exactly the
# spread the figure is about.  No mask: MSLP is meaningful over land and ocean
# alike.
diagnostics:
  spread_rmse_crps:
    domains:
      z500: {region: synoptic}
      msl: {region: impact}

# Synoptic-PCA: leading EOFs to analyze (precursor maps + impact panels baked
# per EOF).  Ian's z500 free-end precursor diversity is high-dimensional --
# synoptic_pca_diversity.png shows ~9-12 effective modes, 6 start-conditioned
# modes clearing the North (1982) separation test, and only ~42-51% cumulative
# EVR in the top 3 -- so the conservative default of 3 under-resolves it.
# 6 = the start-conditioned separable count, the smaller shared-safe ceiling
# across start/end.  Stays <= max_d (10).
synoptic_pca:
  n_eof: 6
