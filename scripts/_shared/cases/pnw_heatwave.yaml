# 2021 Pacific Northwest Heatwave
#
# The June 2021 PNW heat dome set all-time records across the region
# (Lytton BC hit 49.6 C on June 29).  An intense omega block pushed
# 500 hPa heights to extraordinary values.  The 66h window starts at
# 2021-06-25 18Z.

display_name: 2021 Pacific Northwest Heat Wave
year: 2021
timezone: America/Los_Angeles
base: /projectnb/eb-general/jlin404/scratch/2021_pnw_heatwave

ensemble:
  start_time: {year: 2021, month: 6, day: 25, hour: 18}
  size: 1000
  modes: [start, end, both]
  random_seed: 0

# Purpose-named spatial regions (see scripts/_shared/README.md).  Each figure
# draws exactly the region it analyses.
regions:
  # Cause: synoptic precursor box for the joint PCA on z500 (+ msl).  Captures
  # the omega block over the Pacific Northwest, the upstream Pacific wave train
  # that anchored it, and the downstream trough over the central US.  Shifted
  # ~30 deg west and ~30 deg south of the dispatcher's generic N. Atlantic
  # default, which would miss the upstream Pacific source entirely.
  synoptic: { lon: [-170, -100], lat: [25, 70] }
  # Effect: the heat dome's surface signature (land-masked t2m -- see the mask
  # below).  This is the original [-140, -110, 38, 55] domain with the open
  # Pacific trimmed off the western edge.  We reverted to the broad box because
  # the tight PNW-core box ([-125, -116, 42, 52]) held only ~1/3 as many land
  # pixels, so its domain-mean -- the single number the synoptic-PCA impact
  # scalar and the free_end_states ranking both reduce to -- carried too much
  # spatial sampling noise.  The land mask answers the broad box's original
  # problem (it was "~half open Pacific"): ocean t2m is just SST and is masked
  # out, so the western ocean no longer dilutes the mean.  That makes the
  # -140 -> -126 trim almost cosmetic -- it keeps the dashed annotation box off
  # the empty Pacific and drops only a handful of far-offshore island / outer-
  # coast pixels (Haida Gwaii, the Vancouver I. west coast).  The one cost the
  # mask does NOT fix: reaching to 38 N / 55 N / -110 pulls in N. California and
  # the interior Rockies, which warmed less than the core -- accepted here
  # because the omega block is synoptic-scale, so those land pixels move largely
  # with the core and the noise win outweighs the mild dilution.
  # free_end_states reduces/ranks/maps over this box AND the synoptic-PCA scalar
  # impact averages t2m over it and draws it as the dashed annotation -- one
  # impact average, shared, never two.
  impact: { lon: [-126, -110], lat: [38, 55] }

plots:
  members: [0, 1, 2, 3]
  # Member animations render the full standard variable set (surface + upper-air)
  # per member, so the viewport is the synoptic wave-train box -- regions.impact
  # is still far smaller than the wave train and would crop z500 / msl.  Switch
  # to `impact` for the surface core, or give a custom
  # [lon_min, lon_max, lat_min, lat_max].
  view: synoptic

# Focused variable list for case-specific diagnostics.  Drives the
# free_end_states scalar reductions (domain-mean t2m / z500 / msl inside
# regions.impact) and the spread/RMSE/CRPS + power-spectra suites.
#   - t2m  : the heatwave's primary signal (surface temperature anomaly)
#   - z500 : the omega block height field
#   - msl  : surface mass field for cross-check
# t850 would be a natural addition but is not in
# custom_utils.interpolation_utils.STORED_VARIABLES today; adding it
# requires re-running the upstream ensemble interpolation.
#
# free_end_states.mask restricts the RMSE + bbox-mean reductions for selected
# variables to land pixels (ocean t2m is essentially SST and barely moves on a
# multi-day lead window, so leaving the open Pacific in regions.impact's western
# half unmasked would dilute the heatwave member ranking).  Only t2m is masked:
# z500 / msl have meaningful signal over both land and ocean within this box.
# synoptic-PCA reads this same mask so its t2m impact average matches the
# free_end_states scalar pixel-for-pixel.
#
# spread_rmse_crps.domains gives each variable its own analysis box, because
# "which region" is a property of the variable, not of the run.  z500 / msl
# are the synoptic-scale cause (the omega block and its upstream wave train),
# so they reduce over regions.synoptic -- the same pixels the EOF analysis
# uses, which keeps this battery from implying a competing version of the
# spread ratios Text S4 quotes.  t2m is the effect, so it reduces over
# regions.impact with the SAME land mask free_end_states and synoptic-PCA
# apply, which is what makes its spread ratio comparable with the impact
# average those two share.  Averaging t2m over unmasked ocean would be wrong
# twice over: the wrong box, and ocean pixels whose t2m tracks the prescribed
# member-identical SST, contributing full weight to the pixel mean but almost
# no spread.
diagnostics:
  variables: [t2m, z500, msl]
  free_end_states:
    mask:
      t2m: land
  spread_rmse_crps:
    domains:
      z500: {region: synoptic}
      msl: {region: synoptic}
      t2m: {region: impact, mask: land}

# Synoptic-PCA impact variable: the heatwave's surface signature (t2m,
# land-masked over regions.impact, shared with free_end_states).
#
# n_eof: leading EOFs to analyze (precursor maps + impact panels baked per
# EOF).  The z500 free-end precursor diversity here is high-dimensional --
# synoptic_pca_diversity.png shows ~15 effective modes (participation ratio),
# 8 start-conditioned modes clearing the North (1982) separation test, and only
# ~35% cumulative EVR in the top 3 -- so the conservative default of 3
# under-resolves it.  8 = the start-conditioned separable count (the smaller,
# shared-safe ceiling across both conditioning modes), lifting the resolved
# variance to ~60%.  Stays <= max_d (10).
synoptic_pca:
  impact_variable: t2m
  n_eof: 8
